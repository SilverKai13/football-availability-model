[project]
name = "availabilityiq"
version = "0.1.0"
description = "Seven-day player unavailability risk, calibrated and honestly validated."
requires-python = ">=3.13"
dependencies = [
    "pandas==2.3.1",
    "pyarrow==24.0.0",
    "scikit-learn==1.7.1",
    "numpy==2.2.6",
    "PyYAML==6.0.2",
    "httpx==0.28.1",
    "streamlit==1.57.0",
    "typer==0.25.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "ruff==0.15.20", "mypy==1.18.2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "PT", "RET", "SIM", "ARG", "PD"]
ignore = []

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
plugins = []

# pandas ships no stubs and `pandas-stubs` under strict mode turns every DataFrame
# expression into a wall of noise for very little safety on code that is almost all
# DataFrame expressions. Treat the data libraries as untyped and keep the gate on our
# own logic. Recorded as D-014.
[[tool.mypy.overrides]]
module = ["pandas.*", "sklearn.*", "shap.*", "streamlit.*", "pyarrow.*", "numpy.*", "yaml.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiq.*", "tests.*"]
disallow_any_expr = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
