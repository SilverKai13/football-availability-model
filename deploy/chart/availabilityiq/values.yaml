# Default values. The shape to keep in mind:
#
#   scoring CronJob ──writes──▶ artefact volume ◀──reads── api Deployment
#                                                ◀──reads── ui Deployment
#
# The job publishes predictions.parquet and a manifest; the readers reload when
# the manifest changes. Nothing else is shared.

image:
  repository: ghcr.io/silverkai13/football-availability-model
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  # On EKS: eks.amazonaws.com/role-arn for the role that may read and write the
  # artefact bucket (deploy/terraform/aws creates it).
  annotations: {}
  name: ""

artifacts:
  persistence:
    enabled: true
    # Use a claim that already exists instead of creating one.
    existingClaim: ""
    # "" means the cluster default. More than one node needs ReadWriteMany
    # (EFS on EKS, Filestore on GKE); a single node is fine with ReadWriteOnce.
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 1Gi
  # Team names for the API and the page; optional. Served as ids when absent.
  teamsPath: /srv/artifacts/teams.parquet

api:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # Seconds between checks of the manifest for a new publish.
  reloadSeconds: 30
  shortlist: 5
  logLevel: INFO
  service:
    type: ClusterIP
    port: 80
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  # Spread replicas across nodes and zones when there is more than one.
  topologySpread: true
  extraEnv: []

ui:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      memory: 768Mi
  service:
    type: ClusterIP
    port: 80

scoring:
  enabled: true
  # Mondays at 05:00 UK time: the weekend's fixtures are in, the physio meeting is not.
  schedule: "0 5 * * 1"
  timeZone: Europe/London
  command:
    - aiq
    - weekly
    - --destination
    - /srv/artifacts
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 4Gi
  activeDeadlineSeconds: 7200
  backoffLimit: 1
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  # The Sportmonks corpus the export stage reads (data/raw). Mount a claim that
  # holds it; leave empty to run from whatever the image or an init step provides.
  corpus:
    existingClaim: ""
    mountPath: /app/data
  env: []
  # Secrets for the export stage (API tokens) come from a Secret, never from values.
  envFrom: []
  # - secretRef:
  #     name: aiq-scoring

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: aiq.example.com
      paths:
        - path: /
          pathType: Prefix
          service: api
        - path: /ui
          pathType: Prefix
          service: ui
  tls: []

monitoring:
  # Requires the Prometheus Operator CRDs (kube-prometheus-stack).
  serviceMonitor:
    enabled: false
    interval: 30s
    # Match your Prometheus's serviceMonitorSelector, e.g. release: kube-prometheus-stack.
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}
  grafanaDashboard:
    enabled: false
    labels:
      grafana_dashboard: "1"

networkPolicy:
  enabled: true
  # Peers outside this namespace allowed to reach the API and the page: the
  # ingress controller, and Prometheus for /metrics.
  ingressFrom: []
  # - namespaceSelector:
  #     matchLabels:
  #       kubernetes.io/metadata.name: ingress-nginx

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
