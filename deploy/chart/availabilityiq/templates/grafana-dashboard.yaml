{{- if .Values.monitoring.grafanaDashboard.enabled }}
# Picked up by Grafana's sidecar (kube-prometheus-stack) through the label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aiq.fullname" . }}-dashboard
  labels:
    {{- include "aiq.labels" . | nindent 4 }}
    {{- with .Values.monitoring.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  availabilityiq.json: |-
    {{- .Files.Get "files/dashboard.json" | nindent 4 }}
{{- end }}
