{{- if .Values.ui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aiq.fullname" . }}-ui
  labels:
    {{- include "aiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  type: {{ .Values.ui.service.type }}
  ports:
    - name: http
      port: {{ .Values.ui.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "aiq.selectorLabels" (dict "root" . "component" "ui") | nindent 4 }}
{{- end }}
