{{- if .Values.api.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "aiq.fullname" . }}-api
  labels:
    {{- include "aiq.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: {{ .Values.api.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "aiq.selectorLabels" (dict "root" . "component" "api") | nindent 6 }}
{{- end }}
